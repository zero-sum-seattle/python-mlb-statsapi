name: Offline CI

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # Report every interpreter result instead of cancelling the matrix on the
      # first failure, so a single-version incompatibility is easy to isolate.
      fail-fast: false
      # Python 3.15 is intentionally absent: it is still a prerelease during the
      # 1.1 release work and is not claimed as a supported version.
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dependencies
        run: poetry install --no-interaction -E async
      - name: Run offline tests
        run: |
          poetry run pytest \
            tests/ \
            --ignore=tests/external_tests

  sync-only:
    name: Sync-only installation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies without async extra
        run: poetry install --no-interaction --only main

      - name: Verify sync-only installation
        run: |
          poetry run python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("httpx") is None, (
              "HTTPX should not be installed without the async extra"
          )

          import mlbstatsapi
          from mlbstatsapi import Mlb, MlbDataAdapter

          assert mlbstatsapi.Mlb is Mlb
          assert mlbstatsapi.MlbDataAdapter is MlbDataAdapter

          print("Sync-only installation verified without HTTPX")
          PY


  build-package:
    name: Build and validate package
    needs: offline-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Build package
        run: |
          rm -rf dist
          poetry build
      # Validates artifact metadata, source-distribution contents, and a clean
      # install of both the wheel and the source distribution. Runs outside the
      # Poetry environment so the smoke tests cannot import the repository
      # checkout instead of the installed distribution artifact.
      - name: Validate release artifacts
        run: python scripts/validate_release.py
      # Metadata rendering check only; nothing is ever uploaded from CI.
      - name: Twine check artifacts
        run: poetry run twine check dist/*
