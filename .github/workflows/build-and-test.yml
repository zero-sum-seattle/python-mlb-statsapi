name: Offline CI

on:
  pull_request:
    branches:
      - main
      - release/0.9.0
  push:
    branches:
      - main
      - release/0.9.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run offline tests
        run: |
          poetry run pytest \
            tests/ \
            --ignore=tests/external_tests

  build-package:
    name: Build and validate package
    needs: offline-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Build package
        run: |
          rm -rf dist
          poetry build
      # Validates the built artifacts and a clean wheel installation.
      # Runs outside the Poetry environment so the smoke test cannot import
      # the repository checkout instead of the installed distribution.
      - name: Validate release artifacts
        run: python scripts/validate_release.py
